<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusClaw API · Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow-y: scroll; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .topbar { background: #253b35; }
    .topbar-wrapper { max-width: 1460px; margin: 0 auto; }
    .swagger-ui .topbar .download-url-wrapper { display: none; }
    .swagger-ui .info { margin: 26px 0; }
    .local-hint { max-width: 1460px; margin: 18px auto 0; padding: 12px 18px; color: #31564a; background: #eaf5ef; border: 1px solid #cde5d7; border-radius: 8px; font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .local-hint a { color: #176144; }
    @media (max-width: 700px) { .local-hint { margin: 12px; } }
  </style>
</head>
<body>
  <div class="local-hint">
    交互式接口文档。点击 <strong>Authorize</strong>，先调用登录接口取得 <code>access_token</code> 后粘贴令牌（不要加 Bearer 前缀）。
    Try it out 会向当前站点发请求。OpenAPI 文件：<a href="{{ url_for('static', filename='openapi.yaml') }}">openapi.yaml</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "{{ url_for('static', filename='openapi.yaml') }}",
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: true,
        persistAuthorization: false,
        supportedSubmitMethods: ['get', 'post', 'put', 'delete'],
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'StandaloneLayout',
      });
    };
  </script>
</body>
</html>
