{% extends "base.html" %}
{% block title %}登录 | CampusClaw{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <div class="brand-lockup">
      <p class="brand-kicker">A SPACE TO LEARN & GROW</p>
      <h1>CampusClaw</h1>
      <p class="brand-description">让课堂知识触手可及，<br>让每一个问题都有探索的空间。</p>
      <div class="brand-points" aria-label="CampusClaw features">
        <span>课堂知识</span>
        <span>共同探索</span>
        <span>持续成长</span>
      </div>
    </div>
  </div>
  <div class="auth-card">
    <div class="brand-mark" aria-hidden="true">✳</div>
    <p class="eyebrow">WELCOME BACK</p>
    <h2>欢迎回到课堂</h2>
    <p class="muted">登录 CampusClaw，继续你的学习与教学。</p>
    <form class="stack-form" data-login-form>
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" placeholder="请输入校园账号" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" placeholder="请输入密码" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-message error" data-login-error role="alert" hidden></p>
      <button class="button button-primary button-wide" type="submit" data-submit-button>进入课堂</button>
    </form>
    <p class="form-hint">账号由课堂管理员提供。</p>
  </div>
</section>
{% endblock %}
